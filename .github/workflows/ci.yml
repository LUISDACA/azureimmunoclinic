name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  container-images:
    name: Container image build (no push)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build FastAPI image
        run: docker build --tag immunoclinic-api:ci backend

      - name: Build Next.js BFF image
        run: docker build --file frontend-next/Dockerfile --tag immunoclinic-web:ci .

  backend:
    name: Backend (FastAPI + pytest + ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check app tests

      - name: Ruff format check
        run: ruff format --check app tests

      - name: Run tests
        env:
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          SECRET_KEY: "ci-secret-key"
          REFRESH_SECRET_KEY: "ci-refresh-secret-key"
          DEBUG: "true"
          VACCINE_REMINDER_ENABLED: "false"
        run: pytest tests -v

  frontend:
    name: Frontend (Flutter analyze + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.6"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Widget + e2e tests
        run: flutter test --update-goldens test/core/theme/phase5b_admin_create_test.dart

      - name: Commit updated admin screen goldens
        if: github.event_name == 'pull_request'
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ui/evidence/phase5b/admin-create/flutter-form-light-390.png docs/ui/evidence/phase5b/admin-create/flutter-form-dark-390.png
          if ! git diff --cached --quiet; then
            git commit -m "test: update admin screen golden references"
            git push origin "HEAD:${{ github.head_ref }}"
          fi
      - name: Build web (smoke build)
        run: |
          flutter build web --release \
            --dart-define=API_BASE_URL=https://example.com/api/v1 \
            --no-wasm-dry-run

  next:
    name: Frontend Next.js (vitest + lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-next
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend-next/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests (vitest)
        run: npm test
